<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Простой DNS Визуализатор</title>
  <style>
    :root {
      --bg: #0f1724; --card: #0b1220; --accent: #7c3aed; 
      --success: #10b981; --danger: #ef4444; --text: #e6eef8;
    }
    body {
      margin: 0; padding: 20px;
      background: var(--bg); color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
    }
    h1 { margin-top: 0; color: var(--text); }
    .container {
      max-width: 800px; width: 100%;
      display: flex; flex-direction: column; gap: 20px;
    }
    .controls {
      display: flex; gap: 10px; margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .input-group {
      display: flex; gap: 10px; flex: 1;
    }
    input, button {
      padding: 10px 15px; border-radius: 8px;
      border: none; font-size: 16px;
    }
    input {
      flex: 1; background: rgba(255,255,255,0.1);
      color: var(--text); border: 1px solid rgba(255,255,255,0.1);
    }
    button {
      background: var(--accent); color: white;
      font-weight: bold; cursor: pointer;
      white-space: nowrap;
    }
    button.secondary {
      background: rgba(255,255,255,0.1);
    }
    .visualization {
      position: relative; height: 400px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px; overflow: hidden;
    }
    .dns-path {
      position: absolute; top: 50%; left: 0; right: 0;
      height: 4px; background: rgba(255,255,255,0.1);
      transform: translateY(-50%);
    }
    .node {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 120px; height: 60px; border-radius: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; font-size: 14px;
    }
    .node-ip { color: var(--success); font-family: monospace; }
    .packet {
      position: absolute; width: 12px; height: 12px;
      border-radius: 50%; background: var(--accent);
      top: 50%; transform: translate(-50%, -50%);
    }
    .result {
      margin-top: 20px; padding: 15px;
      border-radius: 8px; background: rgba(255,255,255,0.05);
      font-family: monospace; font-size: 18px;
      text-align: center;
    }
    .success { color: var(--success); }
    .error { color: var(--danger); }
    
    /* Стили для полноэкранного режима */
    .fullscreen .container {
      max-width: none; width: 95%;
      height: 95vh;
    }
    .fullscreen .visualization {
      height: 70vh;
    }
    .fullscreen .result {
      font-size: 22px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>DNS Визуализатор</h1>
    <p>Узнайте как доменные имена преобразуются в IP-адреса и обратно</p>
    
    <div class="controls">
      <div class="input-group">
        <input id="input" type="text" placeholder="Введите домен или IP" value="example.com" />
        <button id="resolve">Преобразовать</button>
      </div>
      <button id="fullscreen" class="secondary">Полный экран</button>
    </div>
    
    <div class="visualization">
      <div class="dns-path"></div>
      
      <div class="node" style="left: 50px;">
        <div>Ваш компьютер</div>
      </div>
      
      <div class="node" style="left: 250px;">
        <div>DNS Резольвер</div>
      </div>
      
      <div class="node" style="left: 450px;">
        <div>DNS Сервер</div>
      </div>
      
      <div class="node" style="left: 650px;">
        <div>Авторитативный<br>Сервер</div>
      </div>
    </div>
    
    <div id="result" class="result">
      Введите домен или IP и нажмите "Преобразовать"
    </div>
  </div>

  <script>
    const input = document.getElementById('input');
    const resolveBtn = document.getElementById('resolve');
    const fullscreenBtn = document.getElementById('fullscreen');
    const result = document.getElementById('result');
    const visualization = document.querySelector('.visualization');
    const container = document.querySelector('.container');
    
    // Примеры данных для демонстрации
    const dnsRecords = {
      'example.com': '93.184.216.34',
      'google.com': '142.250.185.206',
      'yandex.ru': '77.88.55.60',
      '93.184.216.34': 'example.com',
      '142.250.185.206': 'google.com',
      '77.88.55.60': 'yandex.ru'
    };
    
    function isIP(input) {
      return /^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$/.test(input);
    }
    
    async function resolve() {
      const query = input.value.trim();
      if (!query) return;
      
      // Очистка предыдущей анимации
      visualization.querySelectorAll('.packet').forEach(p => p.remove());
      result.className = 'result';
      result.textContent = 'Обработка запроса...';
      
      // Создаем пакет для анимации
      const packet = document.createElement('div');
      packet.className = 'packet';
      visualization.appendChild(packet);
      
      // Анимация движения пакета
      const positions = [50, 250, 450, 650];
      let currentPos = 0;
      
      // Запрос идет вперед
      for (let i = 0; i < positions.length; i++) {
        currentPos = positions[i];
        packet.style.left = `${currentPos}px`;
        await new Promise(r => setTimeout(r, 500));
      }
      
      // Ответ идет назад
      for (let i = positions.length - 2; i >= 0; i--) {
        currentPos = positions[i];
        packet.style.left = `${currentPos}px`;
        await new Promise(r => setTimeout(r, 500));
      }
      
      packet.remove();
      
      // Показываем результат
      if (dnsRecords[query]) {
        if (isIP(query)) {
          result.textContent = `Обратный DNS: ${query} → ${dnsRecords[query]}`;
        } else {
          result.textContent = `DNS запись: ${query} → ${dnsRecords[query]}`;
        }
        result.classList.add('success');
      } else {
        result.textContent = `Не удалось найти запись для: ${query}`;
        result.classList.add('error');
      }
    }
    
    // Функция для переключения полноэкранного режима
    function toggleFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.documentElement.requestFullscreen().catch(err => {
          console.error(`Ошибка при переходе в полноэкранный режим: ${err.message}`);
        });
      }
    }
    
    // Обработчики событий
    resolveBtn.addEventListener('click', resolve);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') resolve();
    });
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    
    // Следим за изменениями полноэкранного режима
    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        document.body.classList.add('fullscreen');
        fullscreenBtn.textContent = 'Обычный режим';
      } else {
        document.body.classList.remove('fullscreen');
        fullscreenBtn.textContent = 'Полный экран';
      }
    });
  </script>
</body>
</html>
