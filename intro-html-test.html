<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Игра: Модель OSI</title>
<style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: #e0e0e0;
            transition: all 0.5s ease;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: rgba(40, 40, 40, 0.9);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 30px;
            transition: all 0.5s ease;
        }
        
        h1 {
            text-align: center;
            color: #f5f5f5;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            background-color: #1e88e5;
            color: white;
            padding: 15px;
            border-radius: 10px;
            align-items: center;
        }
        
        .score {
            font-size: 1.3em;
            font-weight: bold;
        }
        
        .game-area {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .levels {
            flex: 1;
            min-width: 300px;
        }
        
        .level {
            background-color: #2d2d2d;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            border-left: 5px solid;
            min-height: 80px;
            color: #e0e0e0;
        }
        
        .level.highlight {
            background-color: #1e3a5f;
            transform: scale(1.02);
        }
        
        .level:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .level h3 {
            margin-top: 0;
            display: flex;
            justify-content: space-between;
            color: #f5f5f5;
        }
        
        .level-items {
            min-height: 20px;
        }
        
        .items {
            flex: 1;
            min-width: 300px;
            background-color: #2d2d2d;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }
        
        .item {
            padding: 10px 15px;
            margin: 8px 0;
            background-color: #3d3d3d;
            border-radius: 5px;
            cursor: grab;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
            user-select: none;
            color: #e0e0e0;
        }
        
        .item:hover {
            background-color: #4d4d4d;
        }
        
        .item.dragging {
            opacity: 0.8;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }
        
        .item.correct {
            background-color: #2e7d32;
            border-left: 3px solid #4caf50;
            color: white;
        }
        
        .item.incorrect {
            background-color: #c62828;
            border-left: 3px solid #f44336;
            color: white;
        }
        
        .feedback {
            text-align: center;
            margin: 20px 0;
            font-size: 1.2em;
            min-height: 30px;
        }
        
        .correct {
            color: #4caf50;
            font-weight: bold;
        }
        
        .incorrect {
            color: #f44336;
            font-weight: bold;
        }
        
        .level-1 { border-color: #00acc1; }
        .level-2 { border-color: #43a047; }
        .level-3 { border-color: #ffb300; }
        .level-4 { border-color: #8e24aa; }
        .level-5 { border-color: #fb8c00; }
        .level-6 { border-color: #e91e63; }
        .level-7 { border-color: #1e88e5; }
        
        .btn {
            background-color: #1e88e5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background-color: #1565c0;
            transform: translateY(-2px);
        }
        
        /* Анимация завершения */
        .completion-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0d47a1 0%, #1a237e 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 1000;
            opacity: 0;
            transition: opacity 1s ease;
        }
        
        .completion-screen.show {
            display: flex;
            opacity: 1;
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall 5s linear infinite;
        }
        
        @keyframes fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        .trophy {
            font-size: 100px;
            margin-bottom: 30px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-30px);
            }
        }
        
        .completion-text {
            font-size: 3em;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .restart-btn {
            background-color: white;
            color: #1e88e5;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 50px;
            margin-top: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        
        @media (max-width: 768px) {
            .game-area {
                flex-direction: column;
            }
            
            .completion-text {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
<div class="container" id="game-container">
<h1>Модель OSI: Сопоставление элементов</h1>
<div class="game-header">
<div class="score">Счет: <span id="score">0</span></div>
<div>Попыток: <span id="attempts">0</span></div>
<button class="btn" id="new-game-btn">Новая игра</button><button class="btn" id="fullscreen-btn">⛶ Полный экран</button>
</div>
<div class="feedback" id="feedback"></div>
<div class="game-area">
<div class="levels">
<h2>Уровни модели OSI</h2>
<div id="levels-container"></div>
</div>
<div class="items">
<h2>Доступные элементы</h2>
<div id="items-container"></div>
</div>
</div>
</div>
<div class="completion-screen" id="completion-screen">
<div class="trophy">🏆</div>
<div class="completion-text">Поздравляем!<br/>Вы успешно завершили игру!</div>
<div>Ваш результат: <span id="final-score">0</span> из <span id="total-questions">0</span></div>
<button class="restart-btn" id="restart-btn">Играть снова</button>
<div id="confetti-container"></div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', function() {
            const game = {
                score: 0,
                attempts: 0,
                draggedItem: null,
                draggedItemElement: null,
                feedback: '',
                totalItems: 0,
                isDragging: false,
                
                levels: [
                    { id: 1, name: "Физический (Physical)", items: [], color: 'level-1' },
                    { id: 2, name: "Канальный (Data Link)", items: [], color: 'level-2' },
                    { id: 3, name: "Сетевой (Network)", items: [], color: 'level-3' },
                    { id: 4, name: "Транспортный (Transport)", items: [], color: 'level-4' },
                    { id: 5, name: "Сеансовый (Session)", items: [], color: 'level-5' },
                    { id: 6, name: "Представления (Presentation)", items: [], color: 'level-6' },
                    { id: 7, name: "Приложений (Application)", items: [], color: 'level-7' }
                ],
                
                itemsPool: [
                    { name: "IP-адреса", level: 3 },
                    { name: "Ethernet (MAC-адреса)", level: 2 },
                    { name: "SSL/TLS-шифрование", level: 6 },
                    { name: "HTTP/HTTPS", level: 7 },
                    { name: "Кабели (витая пара, оптоволокно)", level: 1 },
                    { name: "Порты TCP/UDP", level: 4 },
                    { name: "Установка сессии (RPC, PAP)", level: 5 },
                    { name: "Маршрутизаторы", level: 3 },
                    { name: "Файрволы", level: 4 },
                    { name: "JPEG/ASCII кодирование", level: 6 },
                    { name: "FTP/SMTP", level: 7 },
                    { name: "Wi-Fi", level: 2 },
                    { name: "Коммутаторы", level: 2 },
                    { name: "TCP/UDP протоколы", level: 4 },
                    { name: "DNS", level: 7 },
                    { name: "DHCP", level: 7 },
                    { name: "Волоконно-оптические сигналы", level: 1 }
                ],
                
                currentItems: [],
                
                init() {
                    this.setupEventListeners();
                    this.resetGame();
                    this.render();
                },
                
                setupEventListeners() {
                    // Назначаем обработчик для кнопки перезапуска
                    document.getElementById('restart-btn').addEventListener('click', () => {
                        this.hideCompletionScreen();
                        this.resetGame();
                    });
                    
                    // Назначаем обработчик для кнопки новой игры
                    document.getElementById('new-game-btn').addEventListener('click', () => {
                        this.resetGame();
                    });
                    
                    // Обработчики для drag and drop
                    document.addEventListener('dragstart', (e) => {
                        if (e.target.classList.contains('item') && !e.target.classList.contains('correct')) {
                            this.isDragging = true;
                            this.draggedItemElement = e.target;
                            e.target.classList.add('dragging');
                            
                            const itemName = e.target.textContent;
                            this.draggedItem = this.currentItems.find(item => item.name === itemName);
                            
                            e.dataTransfer.setData('text/plain', itemName);
                            e.dataTransfer.effectAllowed = 'move';
                        }
                    });
                    
                    document.addEventListener('dragend', (e) => {
                        if (e.target.classList.contains('item')) {
                            this.isDragging = false;
                            e.target.classList.remove('dragging');
                        }
                    });
                    
                    document.addEventListener('dragover', (e) => {
                        if (this.isDragging) {
                            e.preventDefault();
                            const levelElement = e.target.closest('.level');
                            if (levelElement) {
                                document.querySelectorAll('.level').forEach(el => el.classList.remove('highlight'));
                                levelElement.classList.add('highlight');
                            }
                        }
                    });
                    
                    document.addEventListener('dragleave', (e) => {
                        const levelElement = e.target.closest('.level');
                        if (levelElement && this.isDragging) {
                            levelElement.classList.remove('highlight');
                        }
                    });
                    
                    document.addEventListener('drop', (e) => {
                        e.preventDefault();
                        document.querySelectorAll('.level').forEach(el => el.classList.remove('highlight'));
                        
                        const levelElement = e.target.closest('.level');
                        if (levelElement && this.draggedItem) {
                            const levelId = parseInt(levelElement.querySelector('h3 span').textContent.split('.')[0]);
                            this.checkAnswer(this.draggedItem, levelId);
                        }
                    });
                },
                
                resetGame() {
                    this.score = 0;
                    this.attempts = 0;
                    this.draggedItem = null;
                    this.draggedItemElement = null;
                    this.feedback = '';
                    this.totalItems = 0;
                    this.isDragging = false;
                    
                    // Очищаем все уровни
                    this.levels.forEach(level => level.items = []);
                    
                    // Выбираем 8 случайных элементов
                    this.currentItems = [...this.itemsPool].sort(() => 0.5 - Math.random()).slice(0, 8);
                    this.totalItems = this.currentItems.length;
                    
                    this.updateStats();
                    this.render();
                },
                
                checkAnswer(item, levelId) {
                    this.attempts++;
                    
                    if (item.level === levelId) {
                        // Правильный ответ
                        this.score++;
                        this.feedback = `✅ Верно! ${item.name} относится к уровню ${levelId}`;
                        
                        // Добавляем элемент на уровень
                        const level = this.levels.find(l => l.id === levelId);
                        level.items.push(item);
                        
                        // Удаляем элемент из доступных
                        this.currentItems = this.currentItems.filter(i => i !== item);
                        
                        // Помечаем элемент как правильный
                        if (this.draggedItemElement) {
                            this.draggedItemElement.classList.add('correct');
                            setTimeout(() => {
                                this.draggedItemElement.remove();
                                this.draggedItemElement = null;
                            }, 500);
                        }
                        
                        // Проверяем завершение игры
                        if (this.currentItems.length === 0) {
                            setTimeout(() => this.showCompletionScreen(), 800);
                            return;
                        }
                        
                        // Добавляем новый элемент, если осталось мало
                        if (this.currentItems.length < 3 && this.itemsPool.length > this.currentItems.length + level.items.length) {
                            const availableItems = this.itemsPool.filter(i => 
                                !this.currentItems.includes(i) && 
                                !this.levels.some(l => l.items.includes(i))
                            );
                            if (availableItems.length > 0) {
                                const newItem = availableItems[Math.floor(Math.random() * availableItems.length)];
                                this.currentItems.push(newItem);
                                this.totalItems++;
                            }
                        }
                    } else {
                        // Неправильный ответ
                        const correctLevel = this.levels.find(l => l.id === item.level);
                        this.feedback = `❌ Неверно! ${item.name} относится к уровню ${correctLevel.name}`;
                        
                        // Помечаем элемент как неправильный
                        if (this.draggedItemElement) {
                            this.draggedItemElement.classList.add('incorrect');
                            setTimeout(() => {
                                this.draggedItemElement.classList.remove('incorrect');
                                this.draggedItemElement = null;
                            }, 1000);
                        }
                    }
                    
                    this.draggedItem = null;
                    this.updateStats();
                    this.render();
                },
                
                showCompletionScreen() {
                    // Скрываем игровое поле
                    document.getElementById('game-container').style.display = 'none';
                    
                    // Показываем экран завершения
                    const completionScreen = document.getElementById('completion-screen');
                    completionScreen.classList.add('show');
                    
                    // Устанавливаем финальный счет
                    document.getElementById('final-score').textContent = this.score;
                    document.getElementById('total-questions').textContent = this.totalItems;
                    
                    // Создаем конфетти
                    this.createConfetti();
                },
                
                hideCompletionScreen() {
                    // Показываем игровое поле
                    document.getElementById('game-container').style.display = 'block';
                    
                    // Скрываем экран завершения
                    const completionScreen = document.getElementById('completion-screen');
                    completionScreen.classList.remove('show');
                },
                
                createConfetti() {
                    const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
                    const container = document.getElementById('confetti-container');
                    container.innerHTML = '';
                    
                    for (let i = 0; i < 100; i++) {
                        const confetti = document.createElement('div');
                        confetti.className = 'confetti';
                        confetti.style.left = Math.random() * 100 + 'vw';
                        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                        confetti.style.width = Math.random() * 10 + 5 + 'px';
                        confetti.style.height = Math.random() * 10 + 5 + 'px';
                        confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                        confetti.style.animationDelay = Math.random() * 2 + 's';
                        container.appendChild(confetti);
                    }
                },
                
                updateStats() {
                    document.getElementById('score').textContent = this.score;
                    document.getElementById('attempts').textContent = this.attempts;
                    
                    const feedbackEl = document.getElementById('feedback');
                    feedbackEl.textContent = this.feedback;
                    feedbackEl.className = 'feedback';
                    
                    if (this.feedback.includes('✅')) {
                        feedbackEl.classList.add('correct');
                    } else if (this.feedback.includes('❌')) {
                        feedbackEl.classList.add('incorrect');
                    }
                },
                
                render() {
                    // Рендерим уровни
                    const levelsContainer = document.getElementById('levels-container');
                    levelsContainer.innerHTML = '';
                    
                    this.levels.forEach(level => {
                        const levelEl = document.createElement('div');
                        levelEl.className = `level ${level.color}`;
                        levelEl.draggable = false;
                        levelEl.innerHTML = `
                            <h3>
                                <span>${level.id}. ${level.name}</span>
                                <span>(${level.items.length})</span>
                            </h3>
                            <div class="level-items">
                                ${level.items.map(item => `<div>• ${item.name}</div>`).join('')}
                            </div>
                        `;
                        levelsContainer.appendChild(levelEl);
                    });
                    
                    // Рендерим доступные элементы
                    const itemsContainer = document.getElementById('items-container');
                    itemsContainer.innerHTML = '';
                    
                    this.currentItems.forEach(item => {
                        const itemEl = document.createElement('div');
                        itemEl.className = 'item';
                        itemEl.textContent = item.name;
                        itemEl.draggable = true;
                        itemsContainer.appendChild(itemEl);
                    });
                }
            };
            
            // Инициализируем игру
            
// Полноэкранный режим
document.getElementById('fullscreen-btn').addEventListener('click', () => {
    const gameContainer = document.documentElement; // можно document.getElementById('game-container')
    if (!document.fullscreenElement) {
        gameContainer.requestFullscreen().catch(err => {
            alert(`Ошибка при переходе в полный экран: ${err.message}`);
        });
    } else {
        document.exitFullscreen();
    }
});

            game.init();
        });
    </script>
</body>
</html>
